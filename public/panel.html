<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alya Arama Paneli</title>

  <style>
    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .panel {
      background: #11161c;
      padding: 40px;
      border-radius: 14px;
      width: 420px;
      text-align: center;
      box-shadow: 0 0 25px rgba(255, 0, 128, 0.25);
    }

    h1 {
      font-size: 26px;
      margin-bottom: 10px;
      margin-top: 10px;
    }

    input {
      width: 95%;
      padding: 15px;
      border-radius: 8px;
      border: none;
      margin-bottom: 20px;
      font-size: 17px;
    }

    button {
      width: 100%;
      background: #1f8b4c;
      color: white;
      padding: 15px;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
    }

    button:hover {
      background: #1aa34a;
    }

    .error {
      margin-top: 15px;
      color: #ff4d4d;
      font-size: 15px;
    }

    .success {
      margin-top: 15px;
      color: #4dff91;
      font-size: 15px;
    }
  </style>
</head>

<body>
  <div class="panel">
    <h1>📞 Alya Arama Paneli</h1>

    <input id="phone" type="text" placeholder="+90XXXXXXXXXX" />

    <button onclick="startCall()">Alya Arasın</button>

    <div id="result"></div>
  </div>

  <script>
    async function startCall() {
      const phone = document.getElementById("phone").value.trim();
      const result = document.getElementById("result");
      result.innerHTML = "";

      if (!phone.startsWith("+") || phone.length < 8) {
        result.innerHTML = "<div class='error'>❌ Geçerli bir telefon numarası gir.</div>";
        return;
      }

      result.innerHTML = "<div class='success'>⏳ Arama başlatılıyor...</div>";

      try {
        const res = await fetch("/call-customer", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ phone })
        });

        const data = await res.json();

        if (data.ok) {
          result.innerHTML = "<div class='success'>✔ Arama başarıyla başlatıldı!</div>";
        } else {
          result.innerHTML = "<div class='error'>❌ Hata: " + JSON.stringify(data) + "</div>";
        }
      } catch (err) {
        result.innerHTML = "<div class='error'>❌ Sunucuya ulaşılamadı.</div>";
      }
    }
  </script>
</body>
</html>
