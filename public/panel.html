<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Alya Arama Paneli</title>
    <style>
        body {
            background: #0d1117;
            color: #e6edf3;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .panel {
            background: #161b22;
            padding: 40px;
            width: 420px;
            text-align: center;
            border-radius: 16px;
            box-shadow: 0 0 25px rgba(255, 0, 80, 0.3);
        }

        h2 {
            margin-bottom: 10px;
        }

        input {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid #30363d;
            outline: none;
            font-size: 16px;
            margin-bottom: 20px;
        }

        button {
            width: 100%;
            background: #238636;
            border: none;
            padding: 14px;
            font-size: 18px;
            color: white;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #2ea043;
        }

        .error {
            margin-top: 15px;
            color: #ff4d4d;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="panel">
    <h2>📞 Alya Arama Paneli</h2>

    <input id="number" type="text" placeholder="+905xxxxxxxxx">

    <button onclick="callCustomer()">Alya Arasın</button>

    <div id="error" class="error"></div>
</div>

<script>
    async function callCustomer() {
        const number = document.getElementById("number").value.trim();
        const errorBox = document.getElementById("error");
        errorBox.textContent = "";

        if (!number || number.length < 10) {
            errorBox.textContent = "❌ Geçerli bir telefon numarası giriniz.";
            return;
        }

        try {
            const response = await fetch("https://alya-call-system.onrender.com/call", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ number })
            });

            const data = await response.json();

            if (!data.ok) {
                errorBox.textContent = "❌ Hata: " + JSON.stringify(data);
            } else {
                errorBox.textContent = "✔ Arama başlatıldı!";
            }

        } catch (err) {
            errorBox.textContent = "❌ Sunucuya ulaşılamadı.";
        }
    }
</script>

</body>
</html>
