<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alya Arama Paneli</title>

    <style>
        body {
            background: #0d1117;
            color: #e6edf3;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .panel {
            background: #161b22;
            padding: 40px;
            width: 420px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(255, 0, 128, 0.2);
            text-align: center;
        }

        h2 {
            margin: 0 0 15px 0;
            font-size: 26px;
        }

        .icon {
            font-size: 40px;
            color: #ff4fa3;
            margin-bottom: 10px;
        }

        input {
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            border: none;
            margin-top: 15px;
            font-size: 16px;
        }

        button {
            margin-top: 25px;
            width: 100%;
            padding: 15px;
            background: #1f8b4c;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #27a85f;
        }

        .error {
            margin-top: 20px;
            color: #ff4f4f;
            font-size: 15px;
        }
    </style>
</head>

<body>

    <div class="panel">
        <div class="icon">📞</div>
        <h2>Alya Arama Paneli</h2>

        <p>Müşteri numarasını gir ve aramayı başlat.</p>

        <input id="phone" placeholder="+90XXXXXXXXXX" />

        <button onclick="callCustomer()">Alya Arasın</button>

        <div id="result" class="error"></div>
    </div>

    <script>
        async function callCustomer() {
            const phone = document.getElementById("phone").value.trim();
            const result = document.getElementById("result");
            result.textContent = "";

            if (!phone.startsWith("+90") || phone.length < 12) {
                result.textContent = "Lütfen geçerli bir telefon numarası girin.";
                return;
            }

            try {
                const response = await fetch("/call-customer", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ phone })
                });

                const data = await response.json();

                if (data.ok) {
                    result.style.color = "#4fff4f";
                    result.textContent = "Alya aramaya başladı! ☎️";
                } else {
                    result.style.color = "#ff4f4f";
                    result.textContent = "Hata: " + JSON.stringify(data);
                }

            } catch (err) {
                result.textContent = "❌ Sunucuya ulaşılamadı.\n" + err;
            }
        }
    </script>

</body>
</html>
